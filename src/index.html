<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdleD - Console StreamDeck</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/overlay.css">
</head>
<body>
    <div id="app-container">
        <!-- En-tête : Titre Fenêtre Active (Haut) -> Vignette Flux Visuel (Milieu) -> Tuile Active (Bas) -->
        <header class="top-bar stream-header">
            <!-- 1. Nom de la Fenêtre Active (Au-dessus) -->
            <div class="active-window-banner" id="active-window-preview" title="Fenêtre Active Actuelle">
                <span class="preview-tag">👁️ FENÊTRE ACTIVE</span>
                <span class="preview-title" id="preview-window-title">Détection...</span>
            </div>

            <!-- 2. Vignette de Capture du Flux Visuel (Entre les deux) -->
            <div class="stream-thumbnail-container" id="stream-thumbnail-container" title="Flux de Reconnaissance Visuelle (DXGI / OCR Live)">
                <img id="stream-thumbnail-img" class="stream-thumbnail-img" alt="Capture Flux" src="" />
                <div class="stream-live-badge"><span class="live-dot">●</span> LIVE FLUX</div>
            </div>

            <!-- 3. Description de la Tuile Active (En-dessous) -->
            <div class="tile-info-badge" id="tile-info-badge">
                <span class="tile-icon">🗺️</span>
                <span class="tile-zone" id="map-zone-name">Amakna (Souterrains)</span>
                <span class="tile-coords highlight" id="map-coords">[4, 28]</span>
                <span class="tile-level" id="map-level">Niv. 1</span>
            </div>
        </header>

        <!-- StreamDeck Pur -->
        <main class="main-content">
            <section class="streamdeck-section pure-deck">
                <!-- Grille Dynamique de Pads -->
                <div class="streamdeck-grid pure-grid" id="streamdeck-grid">
                    <!-- Généré dynamiquement en JS -->
                </div>
            </section>
        </main>

        <!-- Modal / Fenêtre de Configuration StreamDeck -->
        <div class="modal-overlay" id="config-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <span class="modal-title">⚙️ Configuration du StreamDeck</span>
                    <button class="modal-close" id="btn-close-modal">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="input-rows">Nombre de lignes (Rows) :</label>
                        <input type="number" id="input-rows" min="1" max="6" value="2">
                    </div>
                    <div class="form-group">
                        <label for="input-cols">Nombre de colonnes (Columns) :</label>
                        <input type="number" id="input-cols" min="1" max="6" value="3">
                    </div>
                    <div class="form-group-row">
                        <div class="form-group">
                            <label for="input-btn-width">Largeur bouton (px) :</label>
                            <input type="number" id="input-btn-width" min="40" max="250" value="70">
                        </div>
                        <div class="form-group">
                            <label for="input-btn-height">Hauteur bouton (px) :</label>
                            <input type="number" id="input-btn-height" min="40" max="250" value="70">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn btn-save" id="btn-save-config">Enregistrer & Appliquer</button>
                </div>
            </div>
        </div>

        <!-- Barre de Statut Inférieure StreamDeck Ultra-Compacte -->
        <footer class="bottom-status-bar">
            <div class="status-item status-action">
                <span class="status-icon">📜</span>
                <span class="status-value highlight" id="active-script">—</span>
            </div>
            <div class="status-item status-key">
                <kbd class="key-badge" id="last-key">—</kbd>
            </div>
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
