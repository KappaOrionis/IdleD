<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdleD - Console StreamDeck</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/overlay.css">
</head>
<body>
    <div id="app-container">
        <!-- En-tête StreamDeck -->
        <header class="top-bar">
            <div class="brand">
                <span class="brand-logo">◈</span>
                <span class="brand-title">IdleD StreamDeck</span>
            </div>

            <!-- Carte Info Tuile Rétablie dans l'en-tête -->
            <div class="tile-info-badge" id="tile-info-badge">
                <span class="tile-icon">🗺️</span>
                <span class="tile-zone" id="map-zone-name">Amakna (Souterrains)</span>
                <span class="tile-coords highlight" id="map-coords">[4, 28]</span>
                <span class="tile-level" id="map-level">Niv. 1</span>
            </div>

            <div class="top-right-info">
                <div class="status-badge" id="supervisor-status">Idle</div>
            </div>
        </header>

        <!-- StreamDeck Pur -->
        <main class="main-content">
            <section class="streamdeck-section pure-deck">
                <div class="deck-header">
                    <span class="deck-title">CONSOLE DE COMMANDES STREAMDECK</span>
                    <span class="deck-subtitle" id="deck-subtitle-info">Grille Dynamique & Focus Automatique</span>
                </div>
                
                <!-- Grille Dynamique de Pads -->
                <div class="streamdeck-grid pure-grid" id="streamdeck-grid">
                    <!-- Généré dynamiquement en JS -->
                </div>
            </section>
        </main>

        <!-- Modal / Fenêtre de Configuration StreamDeck -->
        <div class="modal-overlay" id="config-modal">
            <div class="modal-card">
                <div class="modal-header">
                    <span class="modal-title">⚙️ Configuration du StreamDeck</span>
                    <button class="modal-close" id="btn-close-modal">✕</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="input-rows">Nombre de lignes (Rows) :</label>
                        <input type="number" id="input-rows" min="1" max="6" value="2">
                    </div>
                    <div class="form-group">
                        <label for="input-cols">Nombre de colonnes (Columns) :</label>
                        <input type="number" id="input-cols" min="1" max="6" value="3">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="modal-btn btn-save" id="btn-save-config">Appliquer les Dimensions</button>
                </div>
            </div>
        </div>

        <!-- Barre de Statut Inférieure StreamDeck -->
        <footer class="bottom-status-bar">
            <div class="status-item">
                <span class="status-icon">📜</span>
                <span class="status-label">Dernière Action Chat :</span>
                <span class="status-value highlight" id="active-script">Aucune commande envoyée</span>
            </div>
            <div class="status-item">
                <span class="status-icon">⌨️</span>
                <span class="status-label">Raccourci enfoncé :</span>
                <kbd class="key-badge" id="last-key">Aucune</kbd>
            </div>
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
