<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IdleD - Console StreamDeck</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles/overlay.css">
</head>
<body>
    <div id="app-container">
        <!-- En-tête StreamDeck -->
        <header class="top-bar">
            <div class="brand">
                <span class="brand-logo">◈</span>
                <span class="brand-title">IdleD StreamDeck</span>
            </div>

            <!-- Carte Info Tuile Rétablie -->
            <div class="tile-info-badge" id="tile-info-badge">
                <span class="tile-icon">🗺️</span>
                <span class="tile-zone" id="map-zone-name">Amakna (Souterrains)</span>
                <span class="tile-coords highlight" id="map-coords">[4, 28]</span>
                <span class="tile-level" id="map-level">Niv. 1</span>
            </div>

            <div class="top-right-info">
                <div class="status-badge" id="supervisor-status">Idle</div>
                <button class="focus-btn" id="btn-focus-dofus" title="Focus immédiat sur la fenêtre Dofus Unity">
                    <span class="btn-icon">🎯</span> Focus Dofus
                </button>
            </div>
        </header>

        <!-- StreamDeck Pur -->
        <main class="main-content">
            <section class="streamdeck-section pure-deck">
                <div class="deck-header">
                    <span class="deck-title">CONSOLE DE COMMANDES STREAMDECK</span>
                    <span class="deck-subtitle">Boutons Macro Chat & Navigation Directe</span>
                </div>
                
                <div class="streamdeck-grid pure-grid" id="streamdeck-grid">
                    <!-- Pad 1 : Salut Chat -->
                    <button class="deck-pad pad-play" id="pad-salut" data-key="F5">
                        <div class="pad-icon">💬</div>
                        <div class="pad-label">SALUT</div>
                        <div class="pad-sub">Écris "salut" dans le chat</div>
                        <kbd class="pad-shortcut">F5</kbd>
                    </button>

                    <!-- Pad 2 : Travel To -->
                    <button class="deck-pad pad-action" id="pad-travel" data-key="F6">
                        <div class="pad-icon">🚀</div>
                        <div class="pad-label">TRAVEL TO</div>
                        <div class="pad-sub">Envoie /travel x,y</div>
                        <kbd class="pad-shortcut">F6</kbd>
                    </button>

                    <!-- Pad 3 : Focus Fenêtre Dofus -->
                    <button class="deck-pad pad-mode" id="pad-focus" data-key="F7">
                        <div class="pad-icon">🔍</div>
                        <div class="pad-label">FOCUS DOFUS</div>
                        <div class="pad-sub">Win32 DXGI / Foreground</div>
                        <kbd class="pad-shortcut">F7</kbd>
                    </button>

                    <!-- Pad 4 : Stop d'Urgence -->
                    <button class="deck-pad pad-stop" id="pad-stop" data-key="F8">
                        <div class="pad-icon">⏹</div>
                        <div class="pad-label">STOP URGENCE</div>
                        <div class="pad-sub">Interruption 0ms</div>
                        <kbd class="pad-shortcut">F8</kbd>
                    </button>
                </div>
            </section>
        </main>

        <!-- Barre de Statut Inférieure StreamDeck -->
        <footer class="bottom-status-bar">
            <div class="status-item">
                <span class="status-icon">📜</span>
                <span class="status-label">Dernière Action Chat :</span>
                <span class="status-value highlight" id="active-script">Aucune commande envoyée</span>
            </div>
            <div class="status-item">
                <span class="status-icon">⌨️</span>
                <span class="status-label">Raccourci enfoncé :</span>
                <kbd class="key-badge" id="last-key">Aucune</kbd>
            </div>
        </footer>
    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
