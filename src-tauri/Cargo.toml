[package]
name = "idled-backend"
version = "0.1.0"
description = "IdleD Superviseur Rust Backend - FSM, Hotkeys, IPC & OS Control"
authors = ["KappaOrionis"]
edition = "2021"

[build-dependencies]
tauri-build = "1.5"

[dependencies]
tauri = { version = "1.5", features = ["api-all", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
